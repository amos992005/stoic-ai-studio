name: Character Forge · Micro-Pilot 1

# GitHub Actions is our $0 orchestrator: it pushes the kernel to Kaggle
# (Dual Tesla T4), waits for it, then commits the inspection artifacts back.

on:
  workflow_dispatch:
    inputs:
      base_seed:
        description: "Golden-reference seed (default 42)"
        required: false
        default: "42"
      allow_fallback:
        description: "Continue without IP-Adapter face lock if it fails to load"
        type: choice
        options: ["false", "true"]
        default: "false"
  push:
    # `main` for production, `arena/**` so feature branches (e.g. the session
    # branch) can render and commit artifacts straight back to themselves.
    branches:
      - main
      - "arena/**"
    paths:
      - "kaggle_kernel/**"
      - "scripts/**"
      - ".github/workflows/character_forge.yml"

permissions:
  contents: write

# Never let two forges race for the same Kaggle kernel slug. Deliberately a
# *constant* group (not per-ref): a `main` run and an `arena/**` run queue up
# instead of hitting Kaggle concurrently, which protects the free GPU quota.
concurrency:
  group: character-forge-kaggle
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OUTPUT_DIR: outputs
  # Commit budget: raw 1024/1344px PNGs stay out of git if they exceed this.
  MAX_COMMIT_BYTES: "5242880"

jobs:
  forge:
    name: Generate Julian (Kaggle T4 x2)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install orchestrator dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          # `six` is an undeclared dependency of kaggle 2.x — make sure it exists
          # before we rely on the CLI at all.
          python -c "import six" || python -m pip install six
          python -c "import kaggle, PIL, six; print('kaggle + pillow + six ready')"
          kaggle --version

      - name: Smoke-test the kernel script (syntax + config only, no GPU)
        run: |
          set -euo pipefail
          python -m py_compile kaggle_kernel/character_forge.py scripts/run_kaggle_job.py
          python - <<'PY'
          import ast, pathlib
          src = pathlib.Path("kaggle_kernel/character_forge.py").read_text()
          ast.parse(src)
          required = ["StableDiffusionXLPipeline", "DPMSolverMultistepScheduler",
                      "CLIPVisionModelWithProjection", "ip-adapter-plus-face_sdxl_vit-h",
                      "SG161222/RealVisXL_V5.0"]
          missing = [r for r in required if r not in src]
          assert not missing, f"kernel script missing: {missing}"
          print("kernel script static checks passed")
          PY

      - name: Run Kaggle job
        # `tee -a` keeps a live log in the repo even if the orchestrator dies.
        # The orchestrator rotates the file first so it never grows unbounded.
        run: |
          set -o pipefail
          mkdir -p outputs
          : > outputs/build.log
          python scripts/run_kaggle_job.py 2>&1 | tee -a outputs/build.log

      - name: Upload artifacts (debug bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-forge-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit artifacts back to the branch
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail

          git config user.name  "stoic-forge-bot"
          git config user.email "stoic-forge-bot@users.noreply.github.com"

          mkdir -p outputs
          touch outputs/build.log

          # Sync with the remote first (best effort; never block publishing).
          git fetch origin "$BRANCH" || true
          git pull --rebase --autostash origin "$BRANCH" || {
            echo "::warning::git pull --rebase failed; aborting rebase and continuing"
            git rebase --abort || true
          }

          # Stage only lightweight, reviewable artifacts (5 MB ceiling per file).
          for f in outputs/contact_sheet.png outputs/metrics.json outputs/build.log; do
            if [ ! -f "$f" ]; then
              echo "skip  $f (not produced)"
              continue
            fi
            size=$(stat -c%s "$f")
            if [ "$size" -ge "$MAX_COMMIT_BYTES" ]; then
              echo "skip  $f (${size} bytes >= ${MAX_COMMIT_BYTES} commit budget)"
              continue
            fi
            git add -f "$f"
            echo "stage $f (${size} bytes)"
          done

          if git diff --cached --quiet; then
            echo "::notice::nothing new to commit (artifacts unchanged or missing)"
            exit 0
          fi

          git commit -m "chore(forge): publish Micro-Pilot 1 artifacts [skip ci]" \
                     -m "Automated by .github/workflows/character_forge.yml · run ${{ github.run_id }}"
          git push origin "HEAD:${BRANCH}"
