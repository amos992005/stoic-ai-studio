name: Render demo reel

# Code-first motion graphics: Remotion + edge-tts. CPU only — no GPU, no
# Kaggle, no model downloads. The whole render is a Node build and a browser
# rasterising 450 frames of CSS.

on:
  push:
    branches:
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# One render at a time per ref: two concurrent renders would race on the same
# committed output file.
concurrency:
  group: render-video-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Fail fast on any uncaught error instead of letting a broken reel ship.
  PYTHONUNBUFFERED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  render:
    name: Render 15s DemoReel (1080x1920)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The publish step pushes the rendered reel back to this branch.
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "edge-tts>=6.1.9" "numpy>=1.26" "scipy>=1.11"

      - name: Install ffmpeg
        # The ubuntu-latest image does not reliably ship ffmpeg, and Remotion
        # does not need it (it bundles its own compositor) — but every gate in
        # this workflow measures the output with ffprobe, so it is a hard
        # dependency of the checks, not of the render.
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Show toolchain
        run: |
          node --version
          npm --version
          python --version
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install Remotion + Chrome Headless Shell
        run: bash scripts/render_setup.sh

      - name: Generate voiceover and SFX
        # edge-tts streams from Microsoft's speech endpoint; a blocked or
        # failed synthesis must fail the job rather than ship a silent reel.
        run: python scripts/generate_audio.py

      - name: Verify the audio before spending 10 minutes on frames
        # Catches a truncated MP3, a wrong duration or a missing SFX in
        # seconds instead of after the render.
        run: |
          python scripts/check_reel.py --audio-only \
            --summary outputs/check_audio.md

      - name: Render
        working-directory: remotion
        run: |
          mkdir -p ../outputs
          npx remotion render src/index.ts DemoReel ../outputs/demo_reel.mp4 \
            --browser=chrome-headless-shell \
            --codec=h264 \
            --pixel-format=yuv420p

      - name: Inspect the rendered reel
        # Records the raw ffprobe/ffmpeg output before any assertion runs, so a
        # failing gate always has the numbers beside it. `|| true`: this step
        # is diagnostics, not a gate.
        if: always()
        run: |
          {
            echo "# raw probe"
            echo
            echo '## ffprobe'
            echo '```json'
            ffprobe -v error -print_format json -show_format -show_streams \
              outputs/demo_reel.mp4 2>&1 | head -200
            echo '```'
            echo
            echo '## volumedetect'
            echo '```'
            ffmpeg -hide_banner -nostats -i outputs/demo_reel.mp4 -map 0:a:0 \
              -af volumedetect -f null - 2>&1 | tail -12
            echo '```'
            echo
            echo '## size'
            ls -l outputs/demo_reel.mp4
          } > outputs/probe.md 2>&1 || true
          python - <<'PY2'
          import pathlib
          path = pathlib.Path("outputs/probe.md")
          head = path.read_text()[:3000] if path.exists() else "(no probe output)"
          summary = pathlib.Path("outputs/probe.md")
          snippet = "\n".join(head.splitlines()[:60])
          if "GITHUB_STEP_SUMMARY" in __import__("os").environ:
              with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                  fh.write("## ffprobe\n\n```\n" + snippet + "\n```\n")
          print(snippet)
          del summary
          PY2

      - name: Verify the rendered reel
        run: |
          python scripts/check_reel.py --summary outputs/check_reel.md

      - name: Write a render report
        run: |
          python - <<'PY'
          import json, pathlib, subprocess

          reel = pathlib.Path("outputs/demo_reel.mp4")
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-print_format", "json",
               "-show_format", "-show_streams", str(reel)],
              capture_output=True, text=True, check=True)
          info = json.loads(probe.stdout)
          video = next(s for s in info["streams"] if s["codec_type"] == "video")
          audio = next(s for s in info["streams"] if s["codec_type"] == "audio")
          report = {
              "engine": "Remotion 4 (React/TypeScript), CPU render",
              "audio": "edge-tts + procedural numpy/scipy SFX",
              "file": str(reel),
              "size_mb": round(reel.stat().st_size / 1e6, 2),
              "video": {
                  "codec": video["codec_name"],
                  "profile": video.get("profile"),
                  "pix_fmt": video["pix_fmt"],
                  "width": video["width"],
                  "height": video["height"],
                  "fps": video["avg_frame_rate"],
                  "frames": video.get("nb_frames"),
                  "duration_s": float(video.get("duration", 0)),
              },
              "audio_stream": {
                  "codec": audio["codec_name"],
                  "sample_rate": audio.get("sample_rate"),
                  "channels": audio.get("channels"),
                  "duration_s": float(audio.get("duration", 0)),
              },
              "duration_s": float(info["format"]["duration"]),
              "orientation": "vertical 9:16",
          }
          pathlib.Path("outputs/demo_reel_report.json").write_text(
              json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Publish the check reports
        # Runs even when a gate fails: the reports are the only readable trace
        # of what the renderer actually produced, and they are small enough to
        # commit on every run. `continue-on-error` keeps the job's own verdict
        # decided by the gates above, not by this bookkeeping.
        if: always()
        continue-on-error: true
        run: |
          mkdir -p outputs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for report in outputs/check_audio.md outputs/check_reel.md outputs/probe.md; do
            if [ -f "$report" ]; then
              git add -f "$report"
            fi
          done
          if git diff --cached --quiet; then
            echo "no new reports to publish"
            exit 0
          fi
          git commit -m "chore(reel): publish check reports for run ${{ github.run_number }} [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Upload reel and evidence (always)
        # `if: always()` matters for the failure case: when a gate trips, the
        # artifact is the only way to see what tripped it (the job log
        # download is not always reachable).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-reel-${{ github.run_number }}
          path: |
            outputs/demo_reel.mp4
            outputs/demo_reel_report.json
            outputs/check_audio.md
            outputs/check_reel.md
            outputs/probe.md
            remotion/public/voiceover.mp3
            remotion/public/audio_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the rendered reel to the branch
        # `outputs/*` is git-ignored by default (it used to hold multi-MB model
        # output), so the deliverable is force-added. `skip ci` keeps this
        # commit from re-triggering the workflow.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f outputs/demo_reel.mp4 outputs/demo_reel_report.json \
            outputs/check_audio.md outputs/check_reel.md
          if git diff --cached --quiet; then
            echo "reel unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(reel): render demo_reel.mp4 (1080x1920, 450f, h264/aac) [skip ci]"
          git pull --rebase --autostash
          git push
