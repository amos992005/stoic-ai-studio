name: Luca Studio · v2 (dual-GPU parallel)

# $0 orchestrator: pushes the Luca kernel to Kaggle (Tesla T4), waits for it,
# then commits the postable asset pack straight back to the branch.
#
# Auto-runs on pushes to arena/** that touch the kernel, its driver, or this
# workflow. Every other phase is dispatch-only so no quota is ever wasted —
# when iterating on unrelated files (README, docs) nothing is triggered.

on:
  workflow_dispatch:
    inputs:
      transcript:
        description: "Line Luca speaks in the reel (~8-10 s of speech)"
        required: false
        default: "Morning in Monaco, sunset in Ibiza. Honestly, the hardest part of today was choosing the view."
  push:
    branches:
      - "arena/**"
    paths:
      - "kaggle_kernel_luca/**"
      - "scripts/luca_v2/**"
      - "scripts/run_luca_job.py"
      - "scripts/run_kaggle_job.py"
      - ".github/workflows/luca_studio.yml"

permissions:
  contents: write

# Shared with Phases 1-2: never race for the same free Kaggle GPU quota.
concurrency:
  group: character-forge-kaggle
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OUTPUT_DIR: outputs
  MAX_COMMIT_BYTES: "5242880"
  # Kernel-side knobs (read by the workers via os.environ).
  BASE_SEED: "42"
  LUCA_TRANSCRIPT: ${{ github.event.inputs.transcript || 'Morning in Monaco, sunset in Ibiza. Honestly, the hardest part of today was choosing the view.' }}
  # The avatar render is the one stage with a real quality/latency trade-off.
  SADTALKER_SIZE: "256"
  SADTALKER_ENHANCER: gfpgan

jobs:
  luca:
    name: Luca Moretti (2x Kaggle T4) - LoRA on cuda:0, voice+reel on cuda:1
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install orchestrator dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -c "import six" || python -m pip install six
          python -c "import kaggle, PIL, six; print('kaggle + pillow + six ready')"
          kaggle --version

      - name: Static checks (syntax, banned techniques, required APIs)
        run: |
          set -euo pipefail
          python -m py_compile \
            kaggle_kernel_luca/luca_studio.py \
            scripts/luca_v2/luca_common.py \
            scripts/luca_v2/luca_character.py \
            scripts/luca_v2/luca_lora.py \
            scripts/luca_v2/generate_images.py \
            scripts/luca_v2/generate_video.py \
            scripts/luca_v2/fetch_instantid.py \
            scripts/luca_v2/_vendor/pipeline_stable_diffusion_xl_instantid.py \
            scripts/run_luca_job.py
          # The kernel is generated; a stale copy silently ships old workers.
          python scripts/build_luca_kernel.py --check

          # Run the kernel the way Kaggle does — as a SCRIPT, not an import.
          # Importing skips `if __name__ == "__main__"`, which is exactly how an
          # entrypoint placed above its embedded payload reached the GPU
          # (run 45950387190). No GPU here, so it is expected to stop after the
          # staging/verification stages; what must not happen is a NameError.
          #
          # The launcher is *killed* as soon as both workers are spawned: on a
          # runner with no GPU the workers immediately pip-install their torch
          # stack, which is neither under test nor survivable inside the job.
          python - <<'PY'
          import os
          import signal
          import subprocess
          import sys
          import tempfile
          import time

          work = tempfile.mkdtemp()
          env = dict(os.environ,
                     OUTPUT_DIR=work,
                     LUCA_WORKER_DIR=os.path.join(work, "luca_workers"),
                     CUDA_VISIBLE_DEVICES="")
          proc = subprocess.Popen(
              [sys.executable, "kaggle_kernel_luca/luca_studio.py"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              text=True, env=env, start_new_session=True)

          markers = {
              "embedded payload verified",
              "prohibition check passed",
              "using committed vendored pipeline",
              "launching both pipelines in parallel",
          }
          seen, captured, deadline = set(), [], time.time() + 300
          for line in iter(proc.stdout.readline, ""):
              captured.append(line)
              seen.update(m for m in markers if m in line)
              if seen == markers or time.time() > deadline:
                  break
          try:
              os.killpg(os.getpgid(proc.pid), signal.SIGKILL)
          except Exception:
              proc.kill()
          proc.wait(timeout=60)
          log = "".join(captured)

          missing = sorted(markers - seen)
          assert not missing, (
              "the generated kernel does not reach " + repr(missing)
              + "\n--- kernel output ---\n" + log[-3000:])

          startup = log.split("[launcher] launching both pipelines in parallel")[0]
          for fatal in ("NameError", "AttributeError", "ModuleNotFoundError",
                        "SyntaxError", "ImportError"):
              assert fatal not in startup, (
                  f"generated kernel raised {fatal} during startup:\n"
                  + startup[-3000:])
          print("kernel runs as a script: staged, verified, vendored, launched")
          PY

          python - <<'PY'
          """
          The static contract for the LoRA architecture.

          Everything here is a property a future edit could silently break and
          that no syntax check would notice: the identity rules, the stage
          order that keeps InstantID out of inference, the mux flags a phone
          needs, and the four banned techniques.
          """
          import ast
          import pathlib
          import re
          import sys

          ROOT = pathlib.Path(".")
          WORKERS = {name: (ROOT / "scripts" / "luca_v2" / name).read_text()
                     for name in ("luca_common.py", "luca_character.py",
                                  "luca_lora.py", "generate_images.py",
                                  "generate_video.py", "fetch_instantid.py",
                                  "_vendor/pipeline_stable_diffusion_xl_instantid.py")}
          launcher = (ROOT / "kaggle_kernel_luca" / "luca_studio.py").read_text()
          driver = (ROOT / "scripts" / "run_luca_job.py").read_text()
          workflow = (ROOT / ".github" / "workflows" / "luca_studio.yml").read_text()

          images = WORKERS["generate_images.py"]
          video = WORKERS["generate_video.py"]
          lora = WORKERS["luca_lora.py"]
          char = WORKERS["luca_character.py"]
          vendor = WORKERS["_vendor/pipeline_stable_diffusion_xl_instantid.py"]

          failures = []

          def want(condition, message):
              if not condition:
                  failures.append(message)


          def code_of(src):
              """
              Keep only executable code.

              Every worker documents the prohibitions in a docstring and reports
              them in a metrics dict (`"inswapper_128": False`), so a naive scan
              rejects the very files that comply. Docstrings go via the AST,
              comment-only lines by prefix, self-reporting lines by pattern.
              """
              try:
                  tree = ast.parse(src)
              except SyntaxError as exc:
                  raise AssertionError(
                      f"cannot parse a worker for the ban scan: {exc}") from exc
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Module, ast.ClassDef,
                                       ast.FunctionDef, ast.AsyncFunctionDef)):
                      doc = ast.get_docstring(node, clean=False)
                      if doc:
                          src = src.replace(doc, "")
              kept = []
              for line in src.splitlines():
                  if line.strip().startswith("#"):
                      continue
                  if re.match(r"^\s*[\"'][^\"']*[\"']\s*:\s*False\s*,?\s*$", line):
                      continue
                  kept.append(line)
              return "\n".join(kept)

          # -- 1. the four banned techniques, on executable code only ---------
          banned = [
              ('pipe.to("cpu")', "CPU offload"),
              ("inswapper_128", "inswapper_128"),
              ("StableVideoDiffusion", "SVD-XT"),
              ("stable-video-diffusion", "SVD-XT"),
              ("StableDiffusionXLImg2ImgPipeline", "SDXL img2img adetailer"),
          ]
          for filename in ("luca_lora.py", "generate_images.py", "generate_video.py"):
              body = code_of(WORKERS[filename])
              for token, label in banned:
                  want(token not in body, f"{filename} reintroduced banned {label}")
          # SadTalker replaces MuseTalk: the old avatar path must be gone, and a
          # half-migrated file is worse than either.
          want("musetalk" not in images.lower() and "musetalk" not in video.lower(),
               "MuseTalk references remain — the video path is now SadTalker")

          # -- 2. identity lives in exactly one place -------------------------
          want('TRIGGER = "ohwx"' in char, "the LoRA trigger word must stay 'ohwx'")
          want("AGE = 27" in char, "the character must stay 27")
          want("def check_prompt" in char, "the celebrity-name guard is missing")
          want('FORBIDDEN_TERMS = ("brad pitt"' in char,
               "the forbidden-name list must still start with the full name")
          # The guard must be *called* on both prompt paths, not merely defined.
          # Two producer functions means two calls (plus the def itself).
          want(char.count("check_prompt(") >= 3,
               "check_prompt must be wired into dataset_prompt and carousel_prompt")

          dataset_entries = re.findall(r'\{"name":', char)
          want(len(dataset_entries) == 15,
               f"expected 15 dataset images, found {len(dataset_entries)}")
          want(len(re.findall(r'"file": "0\d_luca_', char)) == 4,
               "expected the four carousel entries")

          # No prompt may name the actor. The only permitted occurrence in the
          # whole tree is the guard's own deny-list, so the check is "the term
          # appears nowhere but inside FORBIDDEN_TERMS".
          for term in ("brad pitt", "bradley"):
              for filename, source in WORKERS.items():
                  scrubbed = source.replace(
                      'FORBIDDEN_TERMS = ("brad pitt", "brad", "pitt", "bradley")',
                      "")
                  want(term not in scrubbed.lower(),
                       f"{filename} contains the forbidden name {term!r}")

          # -- 3. process 1: dataset -> train -> carousel, in that order ------
          want("SG161222/RealVisXL_V5.0" in images, "base model changed")
          want("InstantX/InstantID" in images, "InstantID weights changed")
          want('DEVICE = "cuda:0"' in images, "image pipeline must pin cuda:0")
          want("set_ip_adapter_scale" in images,
               "ip_adapter_scale is a setter, not a __call__ kwarg")
          want("CompelForSDXL" in images, "compel is required to bypass 77 tokens")
          want("DPMSolverMultistepScheduler" in images and
               "use_karras_sigmas=True" in images, "scheduler must be DPM++ Karras")

          # Read the order from main(), where the stages actually run.
          main_body = images[images.index("def main()"):]
          order = [main_body.index("build_master("),
                   main_body.index("build_dataset("),
                   main_body.index("unload_instantid("),
                   main_body.index("luca_lora.train("),
                   main_body.index("build_carousel(")]
          want(order == sorted(order),
               "main() must run master -> dataset -> unload -> train -> carousel")
          # ...and the carousel must not be handed the reference model.
          want("build_carousel(timings, lora_path)" in main_body,
               "build_carousel must receive only the adapter path")
          want("torch.cuda.empty_cache()" in images,
               "VRAM must be released after InstantID unloads")

          # The carousel must NOT touch InstantID — that is the whole upgrade.
          carousel = code_of(images[images.index("def build_carousel"):
                                    images.index("def main()")])
          for token in ("image_embeds", "image=face_kps", "controlnet_conditioning_scale",
                        "load_instantid"):
              want(token not in carousel,
                   f"carousel calls {token!r} — inference must be LoRA-only")
          want("load_lora_weights" in carousel and "set_adapters" in carousel,
               "the carousel must load and weight the trained adapter")
          want("LORA_SCALE = float(os.environ.get(\"LUCA_LORA_SCALE\", \"0.85\"))" in images,
               "LoRA inference scale must default to 0.85")
          # NO hands near the face, and explicit framing tokens, are what stop
          # the car-bonnet clipping.
          for token in ("medium full shot", "candid 24mm iPhone 16 Pro photo",
                        "natural sunlight", "skin pores"):
              want(token in char, f"the carousel framing token {token!r} was removed")
          want("hands near the face" in char,
               "hands near the face must stay explicitly negative-prompted")

          # -- 4. the training recipe the brief specifies ---------------------
          for needle, label in [
              ("r=16", "rank 16"), ("alpha=16", "alpha 16"),
              ("gradient_checkpointing", "gradient checkpointing"),
              ("float16", "fp16 UNet"),
              ("max_train_steps", "a step budget"),
              ("clip_grad_norm_", "gradient clipping"),
          ]:
              want(needle in lora, f"luca_lora.py lost {label}")
          want("def patch_vae_encoder" in lora,
               "the diffusers 0.42 VAE encode patch is load-bearing for latent caching")
          want('["to_q", "to_k", "to_v", "to_out.0"]' in lora.replace("'", "\""),
               "the LoRA attention targets changed")
          want("math.isfinite" in lora,
               "a non-finite loss must be fatal, not silently saved as a dead adapter")
          want("float32" in lora,
               "trainable adapter params must stay float32 (fp16 + AdamW => NaN)")

          # -- 5. process 2: Chatterbox -> SadTalker -> mandatory mux ---------
          want('PINNED_DEVICE = "cuda:1"' in video, "video pipeline must pin cuda:1")
          want("chatterbox" in video, "TTS must be Chatterbox")
          want("s3gen" in video and "float32" in video,
               "s3gen must be documented as float32 (torch.stft has no fp16 path)")
          want("shim_diffusers_lora" in video and "LoRACompatibleLinear" in video,
               "chatterbox needs the diffusers LoRA shim on a shared interpreter")
          want("def run_sadtalker" in video, "SadTalker must drive the avatar")
          want('"--preprocess", "crop"' in video, "SadTalker must preprocess with crop")
          want("sadtalker" in video and '"--size"' in video, "SadTalker needs an explicit size")
          want('"--still"' not in video,
               "SadTalker must NOT be passed --still (it freezes the head)")
          want("gfpgan" in video, "the GFPGAN enhancer is what fixes the softened mouth")
          want("def wait_for_master" in video,
               "the avatar must poll for the master portrait (cross-process order)")

          for flag in ('"-c:v", "libx264"', '"-pix_fmt", "yuv420p"',
                       '"-c:a", "aac"', '"-movflags", "+faststart"'):
              want(flag in video, f"the mandatory iPhone mux lost {flag}")
          want("def verify_reel" in video and "ffprobe" in video,
               "the reel must be probed, not assumed")
          want("iphone_compatible" in video,
               "the metrics must state the iPhone-compatibility verdict")
          want("luca_reel.mp4" in video and "luca_voice.wav" in video,
               "the deliverable filenames changed")

          # The two import-time shims must precede any gfpgan/SadTalker import.
          want("functional_tensor" in video, "the torchvision 0.17 shim is missing")
          want("VisibleDeprecationWarning" in video, "the numpy 2.0 shim is missing")

          # -- 6. the launcher ships every file both workers import ----------
          for constant in ("LUCA_COMMON_PY", "LUCA_CHARACTER_PY", "LUCA_LORA_PY",
                           "GENERATE_IMAGES_PY", "GENERATE_VIDEO_PY",
                           "FETCH_INSTANTID_PY", "INSTANTID_PIPELINE_PY"):
              want(constant in launcher,
                   f"{constant} is not embedded — the worker would fail to import")
          want("def stage_workers" in launcher and "def verify_embedded" in launcher,
               "the kernel must write and then verify its embedded payload")
          want("check_prohibitions" in launcher and "BANNED" in launcher,
               "the launcher must fail fast on a banned construct")
          want("CUDA_VISIBLE_DEVICES" in launcher,
               "each worker must get exactly one physical GPU")
          want("PYTORCH_CUDA_ALLOC_CONF" in launcher,
               "expandable_segments prevents fragmentation OOM on a 14.5 GB T4")
          want("Popen" in launcher and "threading" in launcher,
               "both workers must run concurrently with live log pumping")

          # -- 7. the driver's manifest matches what the run produces --------
          want('"luca_lora.safetensors"' in driver,
               "the trained adapter must be a required artifact, not optional")
          want("build_luca_kernel" in driver,
               "the driver must regenerate the kernel from scripts/luca_v2/")
          for name in ("01_luca_master.png", "02_luca_yacht.png",
                       "03_luca_porsche.png", "04_luca_party.png",
                       "luca_lora.safetensors", "luca_voice.wav", "luca_reel.mp4"):
              want(name in driver, f"the driver does not expect {name}")
          want("outputs/luca_lora.safetensors" in workflow,
               "the workflow will not commit the adapter back to the branch")

          # -- 8. the vendored InstantID pipeline still has its surface ------
          for symbol in ("StableDiffusionXLInstantIDPipeline", "draw_kps",
                         "load_ip_adapter_instantid"):
              want(symbol in vendor, f"vendored pipeline lost {symbol}")
          want("ensure_pipeline" in WORKERS["fetch_instantid.py"],
               "the bootstrapper must stage the committed pipeline")

          if failures:
              print("static contract FAILED:", file=sys.stderr)
              for failure in failures:
                  print(f"  - {failure}", file=sys.stderr)
              sys.exit(1)
          print(f"luca v2 static contract passed "
                f"({len(failures)} failures across 8 groups)")
          PY
          ls -la kaggle_kernel_luca/ scripts/luca_v2/

      - name: Preflight — Kaggle credentials present?
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KAGGLE_USERNAME:-}" ] || missing="$missing KAGGLE_USERNAME"
          [ -n "${KAGGLE_KEY:-}" ]      || missing="$missing KAGGLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "credentials present (username ${#KAGGLE_USERNAME} chars, key ${#KAGGLE_KEY} chars)"

      - name: Run Kaggle Luca job
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -o pipefail
          mkdir -p outputs
          python scripts/run_luca_job.py 2>&1 | tee -a outputs/build.log

      - name: Upload artifacts (debug bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luca-studio-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit artifacts back to the branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          git config user.name  "stoic-forge-bot"
          git config user.email "stoic-forge-bot@users.noreply.github.com"
          mkdir -p outputs
          touch outputs/build.log

          FILES="outputs/01_luca_master.png outputs/02_luca_yacht.png \
                 outputs/03_luca_porsche.png outputs/04_luca_party.png \
                 outputs/luca_voice.wav outputs/luca_reel.mp4 \
                 outputs/luca_metrics.json \
                 outputs/luca_metrics_images.json outputs/luca_metrics_video.json \
                 outputs/build.log"

          keep() {
            mkdir -p /tmp/artifact_keep
            for f in $FILES; do
              [ -f "$f" ] && cp -f "$f" "/tmp/artifact_keep/$(basename "$f")" || true
            done
          }
          restore() {
            for f in $FILES; do
              b="$(basename "$f")"
              [ -f "/tmp/artifact_keep/$b" ] && cp -f "/tmp/artifact_keep/$b" "$f" || true
            done
          }

          keep
          git fetch origin "$BRANCH" || true
          if ! git pull --rebase --autostash origin "$BRANCH"; then
            echo "::warning::rebase conflicted; resolving artifact conflicts in our favour"
            for f in $FILES; do
              git checkout --ours -- "$f" 2>/dev/null && git add -f "$f" || true
            done
            git rebase --continue --no-edit >/dev/null 2>&1 || {
              echo "::warning::aborting rebase and publishing our results"
              git rebase --abort || true
            }
          fi
          restore

          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "skip  $f (not produced)"
              continue
            fi
            size=$(stat -c%s "$f")
            if [ "$size" -ge "$MAX_COMMIT_BYTES" ]; then
              echo "skip  $f (${size} bytes >= ${MAX_COMMIT_BYTES} commit budget)"
              continue
            fi
            git add -f "$f"
            echo "stage $f (${size} bytes)"
          done

          if git diff --cached --quiet; then
            echo "::notice::nothing new to commit"
            exit 0
          fi
          git commit -m "chore(luca): publish v2 assets (master, scenes, voice, reel) [skip ci]" \
                     -m "Automated by .github/workflows/luca_studio.yml · run ${{ github.run_id }}"
          git push origin "HEAD:${BRANCH}"
