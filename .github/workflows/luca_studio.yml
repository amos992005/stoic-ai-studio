name: Luca Studio · Phase 3

# $0 orchestrator: pushes the Luca kernel to Kaggle (Tesla T4), waits for it,
# then commits the postable asset pack straight back to the branch.
#
# Auto-runs on pushes to arena/** that touch the kernel, its driver, or this
# workflow. Every other phase is dispatch-only so no quota is ever wasted —
# when iterating on unrelated files (README, docs) nothing is triggered.

on:
  workflow_dispatch:
    inputs:
      slide_steps:
        description: "Sampling steps per carousel slide (default 30)"
        required: false
        default: "30"
      svd_frames:
        description: "Neural frames from Stable Video Diffusion (default 25)"
        required: false
        default: "25"
      voice:
        description: "Kokoro voice id (am_adam / am_michael / bm_lewis)"
        required: false
        default: "am_adam"
  push:
    branches:
      - "arena/**"
    paths:
      - "kaggle_kernel_luca/**"
      - "scripts/run_luca_job.py"
      - "scripts/run_kaggle_job.py"
      - ".github/workflows/luca_studio.yml"

permissions:
  contents: write

# Shared with Phases 1-2: never race for the same free Kaggle GPU quota.
concurrency:
  group: character-forge-kaggle
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OUTPUT_DIR: outputs
  MAX_COMMIT_BYTES: "5242880"
  # Kernel-side knobs (env vars are read by luca_studio.py).
  SLIDE_STEPS: ${{ github.event.inputs.slide_steps || '30' }}
  SVD_NUM_FRAMES: ${{ github.event.inputs.svd_frames || '25' }}
  VOICE_NAME: ${{ github.event.inputs.voice || 'am_adam' }}
  BASE_SEED: "777"

jobs:
  luca:
    name: Luca Moretti (Kaggle T4) — carousel + voice + neural video
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install orchestrator dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -c "import six" || python -m pip install six
          python -c "import kaggle, PIL, six; print('kaggle + pillow + six ready')"
          kaggle --version

      - name: Static checks (syntax, banned techniques, required APIs)
        run: |
          set -euo pipefail
          python -m py_compile kaggle_kernel_luca/luca_studio.py scripts/run_luca_job.py
          python - <<'PY'
          import pathlib
          src = pathlib.Path("kaggle_kernel_luca/luca_studio.py").read_text()

          # Source-compiling deps are forbidden (Kaggle is Python 3.13, no compiler).
          forbidden = ["import dlib", "import basicsr", "import spacy", "from basicsr",
                       "import face_alignment", "import insightface"]
          hits = [f for f in forbidden if f in src]
          assert not hits, f"source-compiling dependency reintroduced: {hits}"

          # Techniques explicitly banned by the user.
          banned = {
              "WSOLA time stretching": "def time_stretch",
              "procedural pixel-slice mouth": "open_mouth_patch",
              "custom biquad filter": "def biquad_",
              "custom parametric EQ": "def peaking_boost",
              "pixel-slice strip shift": "apply_head_motion",
          }
          found = [name for name, token in banned.items() if token in src]
          assert not found, f"banned technique reintroduced: {found}"

          # Wheels only: insightface must be pinned at the pure-python wheel.
          assert "insightface>=2.1" in src, "insightface pin lost (pre-2.1 ships a Cython .pyx)"
          for bad in ("import dlib", "import basicsr", "from basicsr", "import spacy"):
              assert bad not in src, f"source-compiling dependency reintroduced: {bad}"

          # The architecture the upgrade is judged on.
          required = [
              "DPMSolverSinglestepScheduler",     # DPM++ SDE Karras
              "sde-dpmsolver++",
              "inswapper_128.onnx",               # Stage 2 biometric swap
              "buffalo_l",
              "StableDiffusionXLImg2ImgPipeline",  # Stage 3 adetailer
              "ip-adapter-plus-face_sdxl_vit-h.safetensors",
              "LivePortrait",                     # dedicated avatar model
              "retarget_lip",                     # audio-driven mouth
              "stable-video-diffusion-img2vid-xt",  # b-roll
              "edge_tts",
              "en-US-AndrewMultilingualNeural",
              "cuda:1",                           # dual-GPU
              "forward-only",
          ]
          missing = [r for r in required if r not in src]
          assert not missing, f"kernel missing expected pieces: {missing}"

          # The specifics users get burned by.
          assert "ip_adapter=OFF" in src, "Stage 1 must state that txt2img runs without IP-Adapter"
          assert "no sunglasses" in src, "negative prompt must forbid sunglasses"
          assert "hands" in src and "five fingers" in src, "hands must be explicit, never hidden"
          assert "hands out of frame" not in src, "hiding hands is forbidden"
          assert src.count("strength=ADETAILER_STRENGTH") >= 1
          assert "ADETAILER_STRENGTH = 0.27" in src, "adetailer strength must be 0.27"
          assert "ADETAILER_SCALE = 0.60" in src, "a-face adapter scale must be 0.60"

          # Failure modes that actually cost us whole runs — keep them fixed.
          assert "list(faces).index" not in src, \
              "insightface Face compares ndarrays: never recover an index via list.index"
          assert "insightface.model_zoo" in src or "model_zoo import get_model" in src, \
              "inswapper must be built via model_zoo.get_model (an INSwapper, not a session)"
          assert "CAROUSEL_BUDGET_S" in src and "REEL_MIN_BUDGET_S" in src, \
              "workers must be wall-clock bounded"
          assert "_load_slides" in src, "the reel must read published slides from disk"
          assert "no reel frames were produced" in src, "the reel must fail loudly, not silently"

          # CLIP truncates at 77 tokens: prompt bloat silently dropped the
          # Porsche and the hands, so budget every prompt explicitly.
          import re
          def _tokens(text):
              n = 0
              for w in re.findall(r"\w+|[^\w\s]", text):
                  n += 1 if (not w.isalnum() or len(w) <= 6) else (1.5 if len(w) <= 12 else 2)
              return round(n)
          prompts = re.findall(r'prompt": \((.*?)\n        \),', src, re.S)
          assert len(prompts) == 5, f"expected 5 prompts, found {len(prompts)}"
          for i, raw in enumerate(prompts, 1):
              text = " ".join(re.findall(r'"([^"]*)"', raw))
              text = re.sub(r"\{PHOTOREAL\}|\{LUCA\}",
                            "unretouched, visible skin pores, photorealistic", text)
              n = _tokens(text)
              assert n <= 80, (f"slide {i} prompt is ~{n} CLIP tokens — "
                               f"anything past 77 is silently discarded")
          print("phase 4 static checks passed")
          PY
          ls -la kaggle_kernel_luca/

      - name: Preflight — Kaggle credentials present?
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KAGGLE_USERNAME:-}" ] || missing="$missing KAGGLE_USERNAME"
          [ -n "${KAGGLE_KEY:-}" ]      || missing="$missing KAGGLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "credentials present (username ${#KAGGLE_USERNAME} chars, key ${#KAGGLE_KEY} chars)"

      - name: Run Kaggle Luca job
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -o pipefail
          mkdir -p outputs
          python scripts/run_luca_job.py 2>&1 | tee -a outputs/build.log

      - name: Upload artifacts (debug bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luca-studio-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit artifacts back to the branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          git config user.name  "stoic-forge-bot"
          git config user.email "stoic-forge-bot@users.noreply.github.com"
          mkdir -p outputs
          touch outputs/build.log

          FILES="outputs/luca_carousel_sheet.png outputs/luca_video_sheet.png \
                 outputs/01_luca_master.png \
                 outputs/luca_reel_clip.mp4 outputs/luca_voice.mp3 \
                 outputs/luca_metrics.json outputs/build.log \
                 outputs/luca_slide_01.jpg outputs/luca_slide_02.jpg \
                 outputs/luca_slide_03.jpg outputs/luca_slide_04.jpg \
                 outputs/luca_slide_05.jpg"

          keep() {
            mkdir -p /tmp/artifact_keep
            for f in $FILES; do
              [ -f "$f" ] && cp -f "$f" "/tmp/artifact_keep/$(basename "$f")" || true
            done
          }
          restore() {
            for f in $FILES; do
              b="$(basename "$f")"
              [ -f "/tmp/artifact_keep/$b" ] && cp -f "/tmp/artifact_keep/$b" "$f" || true
            done
          }

          keep
          git fetch origin "$BRANCH" || true
          if ! git pull --rebase --autostash origin "$BRANCH"; then
            echo "::warning::rebase conflicted; resolving artifact conflicts in our favour"
            for f in $FILES; do
              git checkout --ours -- "$f" 2>/dev/null && git add -f "$f" || true
            done
            git rebase --continue --no-edit >/dev/null 2>&1 || {
              echo "::warning::aborting rebase and publishing our results"
              git rebase --abort || true
            }
          fi
          restore

          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "skip  $f (not produced)"
              continue
            fi
            size=$(stat -c%s "$f")
            if [ "$size" -ge "$MAX_COMMIT_BYTES" ]; then
              echo "skip  $f (${size} bytes >= ${MAX_COMMIT_BYTES} commit budget)"
              continue
            fi
            git add -f "$f"
            echo "stage $f (${size} bytes)"
          done

          if git diff --cached --quiet; then
            echo "::notice::nothing new to commit"
            exit 0
          fi
          git commit -m "chore(luca): publish Phase 3 assets (carousel, voice, neural clip) [skip ci]" \
                     -m "Automated by .github/workflows/luca_studio.yml · run ${{ github.run_id }}"
          git push origin "HEAD:${BRANCH}"
