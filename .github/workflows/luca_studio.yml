name: Luca Studio · v2 (dual-GPU parallel)

# $0 orchestrator: pushes the Luca kernel to Kaggle (Tesla T4), waits for it,
# then commits the postable asset pack straight back to the branch.
#
# Auto-runs on pushes to arena/** that touch the kernel, its driver, or this
# workflow. Every other phase is dispatch-only so no quota is ever wasted —
# when iterating on unrelated files (README, docs) nothing is triggered.

on:
  workflow_dispatch:
    inputs:
      transcript:
        description: "Line Luca speaks in the reel (~8-10 s of speech)"
        required: false
        default: "Morning in Monaco, sunset in Ibiza. Honestly, the hardest part of today was choosing the view."
  push:
    branches:
      - "arena/**"
    paths:
      - "kaggle_kernel_luca/**"
      - "scripts/luca_v2/**"
      - "scripts/run_luca_job.py"
      - "scripts/run_kaggle_job.py"
      - ".github/workflows/luca_studio.yml"

permissions:
  contents: write

# Shared with Phases 1-2: never race for the same free Kaggle GPU quota.
concurrency:
  group: character-forge-kaggle
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OUTPUT_DIR: outputs
  MAX_COMMIT_BYTES: "5242880"
  # Kernel-side knobs (read by the workers via os.environ).
  BASE_SEED: "42"
  LUCA_TRANSCRIPT: ${{ github.event.inputs.transcript || 'Morning in Monaco, sunset in Ibiza. Honestly, the hardest part of today was choosing the view.' }}

jobs:
  luca:
    name: Luca Moretti (2x Kaggle T4) - images on cuda:0, voice+reel on cuda:1
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install orchestrator dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -c "import six" || python -m pip install six
          python -c "import kaggle, PIL, six; print('kaggle + pillow + six ready')"
          kaggle --version

      - name: Static checks (syntax, banned techniques, required APIs)
        run: |
          set -euo pipefail
          python -m py_compile \
            kaggle_kernel_luca/luca_studio.py \
            scripts/luca_v2/generate_images.py \
            scripts/luca_v2/generate_video.py \
            scripts/luca_v2/fetch_instantid.py \
            scripts/luca_v2/_vendor/pipeline_stable_diffusion_xl_instantid.py \
            scripts/run_luca_job.py
          python - <<'PY'
          import pathlib
          import re

          launcher = pathlib.Path("kaggle_kernel_luca/luca_studio.py").read_text()
          images = pathlib.Path("scripts/luca_v2/generate_images.py").read_text()
          video = pathlib.Path("scripts/luca_v2/generate_video.py").read_text()
          fetch = pathlib.Path("scripts/luca_v2/fetch_instantid.py").read_text()
          vendor = pathlib.Path(
              "scripts/luca_v2/_vendor/pipeline_stable_diffusion_xl_instantid.py"
          ).read_text()
          workers = {"generate_images.py": images, "generate_video.py": video}

          def code_of(src):
              """
              Keep only executable code.

              Both workers document the prohibitions in their docstring and
              report them in a metrics dict (`"inswapper_128": False`), so a
              naive scan rejects the compliant files. Docstrings are removed
              through the AST, comments by prefix, self-reporting lines by
              pattern.
              """
              import ast
              try:
                  tree = ast.parse(src)
              except SyntaxError as exc:
                  # Falling back to text here would report a bogus ban violation
                  # for a file that is simply broken; say what is wrong instead.
                  raise AssertionError(
                      f"cannot parse a worker for the ban scan: {exc}") from exc
              if tree is not None:
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.Module, ast.ClassDef,
                                           ast.FunctionDef,
                                           ast.AsyncFunctionDef)):
                          doc = ast.get_docstring(node, clean=False)
                          if doc:
                              src = src.replace(doc, "")
              kept = []
              for line in src.splitlines():
                  if line.strip().startswith("#"):
                      continue
                  if re.match(r"^\s*[\"'][^\"']*[\"']\s*:\s*False\s*,?\s*$", line):
                      continue
                  kept.append(line)
              return "\n".join(kept)

          # -- the four techniques the user banned, on actual code -----------
          banned = [
              ('pipe.to("cpu")', "CPU offload"),
              ("inswapper_128", "inswapper_128"),
              ("StableVideoDiffusion", "SVD-XT"),
              ("stable-video-diffusion", "SVD-XT"),
              ("StableDiffusionXLImg2ImgPipeline", "SDXL img2img adetailer"),
          ]
          for name, src in workers.items():
              body = code_of(src)
              for token, label in banned:
                  assert token not in body, f"{name} reintroduced banned {label}"

          # -- architecture: two scripts, one run, two GPUs ------------------
          assert "generate_video.py" in launcher, "video worker not launched"
          assert "Popen" in launcher and "threading" in launcher, \
              "workers must be spawned concurrently and their logs pumped"
          assert "CUDA_VISIBLE_DEVICES" in launcher, "both GPUs must be exposed"
          assert "PYTORCH_CUDA_ALLOC_CONF" in launcher, \
              "expandable_segments prevents fragmentation OOM on a 14.5 GB T4"
          assert "check_prohibitions" in launcher and "BANNED" in launcher, \
              "the launcher must fail fast on a banned construct"
          assert "preflight_instantid" in launcher, \
              "the InstantID pipeline must be staged before the GPU work starts"
          # `kaggle kernels push` uploads ONLY the code file, so the workers must
          # arrive as a mounted dataset. Run 45947135155 died on exactly this.
          assert "/kaggle/input" in launcher, \
              "the launcher must probe /kaggle/input for the worker dataset"
          assert "worker script not found" in launcher, \
              "a missing worker must fail loudly, not mysteriously"
          driver = pathlib.Path("scripts/run_luca_job.py").read_text()
          assert "publish_dataset" in driver and "dataset_sources" in driver, \
              ("the driver must publish the workers as a dataset and mount it — "
               "kernels push drops sibling files")
          assert '"cuda:0"' in images, "image pipeline must pin cuda:0"
          assert '"cuda:1"' in video, "voice/avatar pipeline must pin cuda:1"

          # -- image pipeline specifics the user fixed -----------------------
          assert "SG161222/RealVisXL_V5.0" in images, "base model changed"
          assert "InstantX/InstantID" in images, "InstantID weights changed"
          assert "antelopev2" in images, "identity analysis must use antelopev2"
          assert "CUDAExecutionProvider" in images, \
              "insightface must run on the GPU provider"
          # The vendored pipeline inherits ControlNetPipeline, not
          # DiffusionPipeline, so `pipe.enable_vae_slicing()` does NOT exist —
          # it aborted run 45947923120 after two minutes of model loading.
          # Slicing must be enabled on the VAE itself.
          assert not re.search(r"^\s*pipe\.enable_vae_slicing\(\)", images, re.M), \
              "pipe.enable_vae_slicing() does not exist on this pipeline"
          assert "vae.enable_slicing()" in images, \
              "VAE slicing must be enabled on the VAE object"
          # chatterbox ships conds.pt in float32; feeding it to fp16 submodules
          # dies with "mat1 and mat2 must have the same dtype" (run 45947923120).
          assert "is_floating_point()" in video, \
              "the conditioning cast must skip integer speech-token ids"
          # Must be the *guarded* cast: a blanket .half() would corrupt the
          # integer speech-token ids that share the same container.
          assert re.search(
              r"if torch\.is_tensor\(value\) and value\.is_floating_point\(\):\s*\n"
              r"\s*setattr\(t3_cond, field, value\.half\(\)\)", video), \
              "conds.pt float tensors must be cast to fp16 behind an is_floating_point guard"
          assert 'getattr(model, "conds", None)' in video or "model.conds" in video, \
              "the built-in conditioning must be reached through the model"
          assert "CompelForSDXL" in images, "compel is required to bypass 77 tokens"
          assert "DPMSolverMultistepScheduler" in images and \
                 "use_karras_sigmas=True" in images, "scheduler must be DPM++ Karras"
          assert "float16" in images, "SDXL must run in fp16"
          assert "set_ip_adapter_scale" in images, \
              ("ip_adapter_scale is not a __call__ kwarg - it is swallowed by "
               "**kwargs and silently ignored; use the setter")
          assert "ip_adapter_scale=0.80" not in images, \
              "ip_adapter_scale passed to the pipeline call would be ignored"

          prefix = (
              "24mm iPhone 16 Pro candid photo, dirty blonde tousled hair, "
              "light 3-day stubble, natural sunlight, visible skin pores, "
              "slight film grain"
          )

          def collapsed(text):
              return re.sub(r"\s+", " ", text.replace('"', "")).strip()

          # The literal is wrapped across implicit-concatenation lines, so
          # compare on collapsed whitespace rather than exact source layout.
          assert collapsed(prefix) in collapsed(images), \
              "the required prompt prefix was altered"
          assert images.count("LENS_SPEC") >= 2, \
              "every scene prompt must start with the lens prefix"

          for needle, label in [("MASTER_CFG = 3.8", "master CFG 3.8"),
                                ("MASTER_STEPS = 30", "master 30 steps"),
                                ("SCENE_IP_ADAPTER_SCALE = 0.80", "ip adapter 0.80"),
                                ("SCENE_CONTROLNET_SCALE = 0.55", "controlnet 0.55")]:
              assert needle in images, f"{label} changed"

          assert "hands" in images.lower(), "hands must be explicit"
          assert re.search(r"hands near the face", images), \
              "the master portrait must forbid hands near the face"
          assert "face_box_for" in images or "male face" in images, \
              "party scene needs a male-face-bbox-targeted identity repair"

          # -- video pipeline specifics ---------------------------------------
          assert "chatterbox" in video, "TTS must be Chatterbox"
          assert "tts_turbo" in video, \
              "Turbo lives at chatterbox.tts_turbo, not the package root"
          # The cleanup trio must sit together inside release_tts_vram, in order.
          cleanup = re.search(
              r"del (\w+)\s*\n\s*gc\.collect\(\)\s*\n\s*"
              r"torch\.cuda\.empty_cache\(\)", video)
          assert cleanup, \
              ("TTS VRAM release must be exactly del <model>; gc.collect(); "
               "torch.cuda.empty_cache() back to back")
          # Compare definition order, not the first mention (docstrings lie).
          assert 'timed("release_tts_vram"' in video, \
              "the VRAM release stage is missing"
          assert 'timed("release_tts_vram"' in video and \
                 video.index('timed("release_tts_vram"') < \
                 video.index("def run_musetalk"), \
              "VRAM must be released before MuseTalk loads"
          assert "MuseTalk" in video, "MuseTalk required for the talking avatar"
          assert "wait_for_master" in video or "01_luca_master.png" in video, \
              "the avatar must poll for the master portrait (cross-process order)"
          assert "ffprobe" in video, "the reel must be verified with ffprobe"
          assert "luca_reel.mp4" in video and "luca_voice.wav" in video
          assert "unet.timesteps" not in code_of(video), \
              "MuseTalk UNet has no .timesteps attribute"
          assert "SD_VAE_FILES" in video and "safetensors" in video, \
              "sd-vae ships safetensors only; requesting the .bin 404s"
          assert "merge_metrics" in images and "merge_metrics" in video, \
              "both workers must merge their metrics half under a lock"
          assert "fcntl.flock" in images and "fcntl.flock" in video, \
              "the shared luca_metrics.json needs an exclusive lock"

          # -- dependency pins that decide whether pip can install at all ----
          assert "onnxruntime-gpu==1.22.0" in images, \
              "onnxruntime-gpu 1.32 is CUDA 13; a T4 runtime is CUDA 12"
          assert "onnx==1.23.2" in images, "onnx needs the cp312-abi3 wheel"
          assert "insightface==2.1" in images, "insightface must be the wheel release"
          # chatterbox pins diffusers==0.29 for a symbol newer diffusers dropped;
          # process 1 needs >=0.30 on the same interpreter, so the shim is
          # load-bearing, not decorative.
          assert "shim_diffusers_lora" in video, \
              "chatterbox needs the diffusers LoRA shim on a shared interpreter"
          assert "LoRACompatibleLinear" in video, \
              "the shim must restore the exact symbol chatterbox imports"
          assert "--no-deps" in images, \
              ("insightface must be installed --no-deps: its opencv-python "
               "dependency imports libGL, which Kaggle does not have")

          # -- the vendored InstantID pipeline --------------------------------
          for symbol in ("StableDiffusionXLInstantIDPipeline", "draw_kps",
                         "load_ip_adapter_instantid"):
              assert symbol in vendor, f"vendored pipeline lost {symbol}"
          assert "ensure_pipeline" in fetch and "_vendor" in fetch, \
              "the bootstrapper must prefer the committed pipeline over the network"

          print("v2 static checks passed")
          PY
          ls -la kaggle_kernel_luca/ scripts/luca_v2/

      - name: Preflight — Kaggle credentials present?
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KAGGLE_USERNAME:-}" ] || missing="$missing KAGGLE_USERNAME"
          [ -n "${KAGGLE_KEY:-}" ]      || missing="$missing KAGGLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "credentials present (username ${#KAGGLE_USERNAME} chars, key ${#KAGGLE_KEY} chars)"

      - name: Run Kaggle Luca job
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -o pipefail
          mkdir -p outputs
          python scripts/run_luca_job.py 2>&1 | tee -a outputs/build.log

      - name: Upload artifacts (debug bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luca-studio-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit artifacts back to the branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          git config user.name  "stoic-forge-bot"
          git config user.email "stoic-forge-bot@users.noreply.github.com"
          mkdir -p outputs
          touch outputs/build.log

          FILES="outputs/01_luca_master.png outputs/02_luca_yacht.png \
                 outputs/03_luca_porsche.png outputs/04_luca_party.png \
                 outputs/luca_voice.wav outputs/luca_reel.mp4 \
                 outputs/luca_metrics.json \
                 outputs/luca_metrics_images.json outputs/luca_metrics_video.json \
                 outputs/build.log"

          keep() {
            mkdir -p /tmp/artifact_keep
            for f in $FILES; do
              [ -f "$f" ] && cp -f "$f" "/tmp/artifact_keep/$(basename "$f")" || true
            done
          }
          restore() {
            for f in $FILES; do
              b="$(basename "$f")"
              [ -f "/tmp/artifact_keep/$b" ] && cp -f "/tmp/artifact_keep/$b" "$f" || true
            done
          }

          keep
          git fetch origin "$BRANCH" || true
          if ! git pull --rebase --autostash origin "$BRANCH"; then
            echo "::warning::rebase conflicted; resolving artifact conflicts in our favour"
            for f in $FILES; do
              git checkout --ours -- "$f" 2>/dev/null && git add -f "$f" || true
            done
            git rebase --continue --no-edit >/dev/null 2>&1 || {
              echo "::warning::aborting rebase and publishing our results"
              git rebase --abort || true
            }
          fi
          restore

          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "skip  $f (not produced)"
              continue
            fi
            size=$(stat -c%s "$f")
            if [ "$size" -ge "$MAX_COMMIT_BYTES" ]; then
              echo "skip  $f (${size} bytes >= ${MAX_COMMIT_BYTES} commit budget)"
              continue
            fi
            git add -f "$f"
            echo "stage $f (${size} bytes)"
          done

          if git diff --cached --quiet; then
            echo "::notice::nothing new to commit"
            exit 0
          fi
          git commit -m "chore(luca): publish v2 assets (master, scenes, voice, reel) [skip ci]" \
                     -m "Automated by .github/workflows/luca_studio.yml · run ${{ github.run_id }}"
          git push origin "HEAD:${BRANCH}"
