name: Talking Pilot · Micro-Pilot 2

# MANUAL ONLY (dispatch). Phase 2 is closed out: the envelope-mouth synthesiser
# it produces has been superseded by Phase 3's real neural video, so this
# workflow no longer auto-runs on push. Kept for reproducibility of the Phase 2
# artifacts; trigger it by hand from the Actions tab if you ever need a re-run.

on:
  workflow_dispatch:
    inputs:
      neural_lipsync:
        description: "Try Wav2Lip ONNX before the viseme synthesiser"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: write

concurrency:
  # Shared with Phase 1 so the two never fight over Kaggle's GPU quota.
  group: character-forge-kaggle
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OUTPUT_DIR: outputs
  MAX_COMMIT_BYTES: "5242880"
  # Kernel-side knobs
  ENABLE_NEURAL_LIPSYNC: ${{ github.event.inputs.neural_lipsync || 'true' }}
  LIPSYNC_PROBE_SECONDS: "150"

jobs:
  talking:
    name: Voice & talking avatar (Kaggle T4)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install orchestrator dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -c "import six" || python -m pip install six
          python -c "import kaggle, PIL, six; print('kaggle + pillow + six ready')"
          kaggle --version

      - name: Static checks (kernel syntax, portrait present, no source-only deps)
        run: |
          set -euo pipefail
          python -m py_compile kaggle_kernel_talking/talking_pilot.py scripts/run_talking_job.py
          test -f kaggle_kernel_talking/assets/julian_portrait_1024.png || {
            echo "::error::portrait asset missing — it is published as a Kaggle dataset, not shipped with the push."
            exit 1
          }
          python - <<'PY'
          import pathlib
          src = pathlib.Path("kaggle_kernel_talking/talking_pilot.py").read_text()
          forbidden = ["import dlib", "import basicsr", "import spacy", "from basicsr", "import face_alignment"]
          hits = [f for f in forbidden if f in src]
          assert not hits, f"source-compiling dependency reintroduced: {hits}"
          required = ["kokoro_onnx", "libx264", "yuv420p", "WAV2LIP_REPOS", "create_timed"]
          missing = [r for r in required if r not in src]
          assert not missing, f"kernel missing expected pieces: {missing}"
          print("phase 2 static checks passed")
          PY
          ls -la kaggle_kernel_talking/

      - name: Preflight — Kaggle credentials present?
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KAGGLE_USERNAME:-}" ] || missing="$missing KAGGLE_USERNAME"
          [ -n "${KAGGLE_KEY:-}" ]      || missing="$missing KAGGLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "credentials present (username ${#KAGGLE_USERNAME} chars, key ${#KAGGLE_KEY} chars)"

      - name: Run Kaggle talking job
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -o pipefail
          mkdir -p outputs
          python scripts/run_talking_job.py 2>&1 | tee -a outputs/build.log

      - name: Upload artifacts (debug bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talking-pilot-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit artifacts back to the branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          git config user.name  "stoic-forge-bot"
          git config user.email "stoic-forge-bot@users.noreply.github.com"
          mkdir -p outputs
          touch outputs/build.log

          keep() {
            mkdir -p /tmp/artifact_keep
            for f in pilot_talking.mp4 julian_voice.mp3 talking_contact_sheet.png \
                     talking_metrics.json build.log; do
              [ -f "outputs/$f" ] && cp -f "outputs/$f" /tmp/artifact_keep/ || true
            done
          }
          restore() {
            for f in pilot_talking.mp4 julian_voice.mp3 talking_contact_sheet.png \
                     talking_metrics.json build.log; do
              [ -f "/tmp/artifact_keep/$f" ] && cp -f "/tmp/artifact_keep/$f" "outputs/$f" || true
            done
          }

          keep
          git fetch origin "$BRANCH" || true
          if ! git pull --rebase --autostash origin "$BRANCH"; then
            echo "::warning::rebase conflicted; resolving artifact conflicts in our favour"
            for f in outputs/pilot_talking.mp4 outputs/julian_voice.mp3 \
                     outputs/talking_contact_sheet.png outputs/talking_metrics.json outputs/build.log; do
              git checkout --ours -- "$f" 2>/dev/null && git add -f "$f" || true
            done
            git rebase --continue --no-edit >/dev/null 2>&1 || {
              echo "::warning::aborting rebase and publishing our results"
              git rebase --abort || true
            }
          fi
          restore

          for f in outputs/pilot_talking.mp4 outputs/julian_voice.mp3 \
                   outputs/talking_contact_sheet.png outputs/talking_metrics.json outputs/build.log; do
            if [ ! -f "$f" ]; then
              echo "skip  $f (not produced)"
              continue
            fi
            size=$(stat -c%s "$f")
            if [ "$size" -ge "$MAX_COMMIT_BYTES" ]; then
              echo "skip  $f (${size} bytes >= ${MAX_COMMIT_BYTES} commit budget)"
              continue
            fi
            git add -f "$f"
            echo "stage $f (${size} bytes)"
          done

          if git diff --cached --quiet; then
            echo "::notice::nothing new to commit"
            exit 0
          fi
          git commit -m "chore(talking): publish Micro-Pilot 2 artifacts [skip ci]" \
                     -m "Automated by .github/workflows/talking_pilot.yml · run ${{ github.run_id }}"
          git push origin "HEAD:${BRANCH}"
